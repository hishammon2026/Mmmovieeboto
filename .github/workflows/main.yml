name: GitHub-Actions-Bot-Deploy

on:
  push:
    branches: [ DreamXBotz ]
  workflow_dispatch:
  schedule:
    # ഓരോ 15 മിനിറ്റിലും ബോട്ട് ചെക്ക് ചെയ്യാനും റൺ ചെയ്യാനും
    - cron: '*/15 * * * *'

# ഒരേസമയം ഒന്നിലധികം ബോട്ട് റൺ ആകുന്നത് തടയാൻ
concurrency:
  group: bot-running
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python3 -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Running The Bot
      # 14 മിനിറ്റ് (അടുത്ത ഷെഡ്യൂളിന് മുൻപ് കൃത്യമായി നിർത്താൻ)
      timeout-minutes: 14
      run: python3 bot.py
